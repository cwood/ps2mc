name: ci

on:
  push:
    branches: [main, master]
  # labeled/unlabeled so the changelog check re-runs when the skip label is
  # applied or removed, rather than needing a manual re-run.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # Every pull request records what it changed. Apply the `no-changelog` label
  # to skip this for changes with nothing worth a release note.
  changelog:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.txt entry
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"
          if git diff --name-only FETCH_HEAD...HEAD | grep -qx CHANGELOG.txt; then
            echo "CHANGELOG.txt updated."
            exit 0
          fi
          echo "This pull request does not touch CHANGELOG.txt."
          echo "Add a line under the Unreleased section describing the change,"
          echo "or apply the 'no-changelog' label if it does not warrant one."
          exit 1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Card fixtures are 8 MiB binaries and are not tracked, so they are
      # generated here with the same reference tool the ECC vectors came from.
      # Tests that need them skip when absent, so this keeps coverage honest.
      - name: Generate test fixtures
        run: |
          python3 -m pip install --quiet mymcplus
          mkdir -p testdata/fixtures
          python3 -m mymcplus testdata/fixtures/test-ecc.ps2 format -c 8192 -f
          python3 -m mymcplus testdata/fixtures/test-raw.ps2 format -c 8192 -f -e
          for img in test-ecc test-raw; do
            python3 -m mymcplus "testdata/fixtures/$img.ps2" mkdir APPS
            printf 'hello from the reference tool' > HELLO.TXT
            head -c 3000 /dev/urandom > BIN.DAT
            python3 -m mymcplus "testdata/fixtures/$img.ps2" add -d APPS HELLO.TXT BIN.DAT
          done
          rm -f HELLO.TXT BIN.DAT

      - name: Test
        run: make test

      - name: Build
        run: make build

  cross:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          # go-fuse supports Linux and macOS only; elsewhere the fusefs
          # package drops out and the mount command is stubbed, so the rest
          # of the tool still builds.
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
